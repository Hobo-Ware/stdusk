[package]
name = "stdusk"
version = "1.9.1"
edition = "2024"

[lints]
workspace = true

[dependencies]
stdusk-core.workspace = true
stdusk-egui.workspace = true
anyhow = "1.0.104" # update check + brew upgrade: several error sources under one `?`
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] } # get_image() for clipboard image paste
base64.workspace = true
eframe = { version = "0.35.0", features = ["glow", "__screenshot"] }
egui.workspace = true
global-hotkey = "0.8.0"
libc.workspace = true # killpg on tab/app close: SIGTERM+SIGKILL the shell's process group (kill orphans)
rustix.workspace = true # session handoff: SCM_RIGHTS fd passing + tcsetwinsize, both SAFE (the crate forbids unsafe)
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
toml.workspace = true
ureq = "3.4.2" # update check: one redirect read from github.com/<repo>/releases/latest

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6" # NSEvent local monitor block (Cmd+V image-paste hook on macOS)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSUserDefaults"] } # AppleInterfaceStyle: the OS light/dark answer at startup
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] } # Open at login: SMAppService main-app login item
tray-icon = "0.24.1"
winit = "0.30" # macOS activation policy (accessory app) via eframe's event_loop_builder hook

[dev-dependencies]
stdusk-core = { workspace = true, features = ["test-support"] }

[workspace]
members = [".", "crates/stdusk-core", "crates/stdusk-egui"]
resolver = "3"

[workspace.dependencies]
stdusk-core = { path = "crates/stdusk-core" }
stdusk-egui = { path = "crates/stdusk-egui" }
base64 = "0.22.1"
egui = "0.35.0"
libc = "0.2"
proptest = "1.8.0"
rustix = { version = "1.1.4", features = ["net", "termios"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
toml = "1.1.3"

[workspace.lints.rust]
unsafe_code = "deny" # justified local #[allow]s only: main's edition-2024 set_var + terminal's killpg FFI

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic allow-list, justified per-lint for a GUI + parser crate:
cast_possible_truncation = "allow" # deliberate: pct as u8, cols as u16 for PtySize
cast_sign_loss = "allow"           # grid line i32 -> usize after .max(0)
cast_precision_loss = "allow"      # u8 pct -> f32 for the progress bar
cast_possible_wrap = "allow"       # usize offsets -> i32 for scroll deltas
module_name_repetitions = "allow"  # OscScanner in osc, TabState in terminal read fine
missing_errors_doc = "allow"       # no public library API to document
missing_panics_doc = "allow"       # startup-invariant expects are documented inline
doc_markdown = "allow"             # terminal jargon (OSC, ANSI, pty, cwd, Tabby) isn't code
enum_glob_use = "allow"            # `use NamedColor::*` in a 16-arm match reads fine
float_cmp = "allow"                # exact != 0.0 / defaults comparisons are intentional
similar_names = "allow"            # bel/st, cw/ch, rows/cols are the domain vocabulary
too_many_lines = "allow"           # the eframe render loop is legitimately long
too_many_arguments = "allow"       # render_grid threads ui + rect + term + metrics per pane
must_use_candidate = "allow"       # the library surface has no must-use contract; the app is its only caller
