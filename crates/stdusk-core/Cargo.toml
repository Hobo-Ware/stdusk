[package]
name = "stdusk-core"
version = "1.9.1"
edition = "2024"

[lints]
workspace = true

[features]
test-support = []

[dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.22.1"
ecolor = "0.35.0"
emath = "0.35.0"
libc = "0.2"
portable-pty = "0.9.0"
regex = "1.13.0"
rustix = { version = "1.1.4", features = ["net", "termios"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
toml = "1.1.3"

[dev-dependencies]
proptest = "1.8.0"
