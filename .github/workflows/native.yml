name: native (rust)

on:
  push:
    branches: [main]
    paths: ['src/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', 'assets/**', 'packaging/**', '.github/workflows/native.yml']
  # No paths filter on PRs: the `check` job is a REQUIRED status check, so it must run on
  # every PR - a filtered check that skips reports nothing and blocks the merge forever.
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets

  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype6-dev zsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: quiet zsh global compinit
        run: echo 'skip_global_compinit=1' | sudo tee -a /etc/zsh/zshenv
      - name: test
        run: cargo test --workspace --all-targets
